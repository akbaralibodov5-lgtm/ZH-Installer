name: Build ZH Installer EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "installer.spec"
      - "requirements-build.txt"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<26"
          python -m pip install --no-cache-dir "pyinstaller==5.13.2"
          if (Test-Path -LiteralPath "requirements-build.txt") {
            python -m pip install --no-cache-dir -r "requirements-build.txt"
          }

      - name: Validate source
        shell: pwsh
        run: |
          $entry = Join-Path $env:GITHUB_WORKSPACE "src/installer.py"
          if (-not (Test-Path -LiteralPath $entry -PathType Leaf)) {
            throw "Missing application entry point: $entry"
          }
          python -m py_compile $entry
          Write-Host "Python syntax validation passed."

      - name: Build EXE
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "build","dist" -Recurse -Force -ErrorAction SilentlyContinue
          pyinstaller --clean --noconfirm installer.spec
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist/ZH_Installer-WARU.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            Get-ChildItem -LiteralPath "dist" -Recurse -Force -ErrorAction SilentlyContinue |
              Select-Object FullName,Length |
              Format-Table -AutoSize
            throw "PyInstaller did not produce the expected EXE."
          }
          $item = Get-Item -LiteralPath $exe
          Write-Host ("Built EXE: {0}" -f $item.FullName)
          Write-Host ("Size: {0:N0} bytes" -f $item.Length)

      - name: Upload built EXE
        uses: actions/upload-artifact@v4
        with:
          name: zh-installer-waru-exe
          path: dist/ZH_Installer-WARU.exe
          if-no-files-found: error
          retention-days: 14
