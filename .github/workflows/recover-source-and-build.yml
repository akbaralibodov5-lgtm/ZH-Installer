name: Recover Source and Build EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "ZH_Installer V1.9.exe"
      - ".github/workflows/recover-source-and-build.yml"

permissions:
  contents: write

jobs:
  recover-and-build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install recovery tools
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<26"
          python -m pip install --no-cache-dir "pyinstxtractor-ng==2025.1.6"

      - name: Extract original PyInstaller bundle
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "ZH_Installer V1.9.exe"
          & pyinstxtractor-ng $exe
          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller extraction failed with exit code $LASTEXITCODE."
          }

          $source = Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Directory -Force |
            Where-Object { $_.Name -like "*_extracted" } |
            Select-Object -First 1

          if (-not $source) {
            throw "Extraction directory was not found."
          }

          New-Item -ItemType Directory -Force -Path "recovery" | Out-Null
          if (Test-Path "recovery/extracted") {
            Remove-Item "recovery/extracted" -Recurse -Force
          }
          Move-Item $source.FullName "recovery/extracted"

      - name: Build modern pycdc decompiler
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/zrsx/pycdc.git "$env:GITHUB_WORKSPACE/pycdc"
          cmake -S "$env:GITHUB_WORKSPACE/pycdc" -B "$env:GITHUB_WORKSPACE/pycdc-build" -A x64
          cmake --build "$env:GITHUB_WORKSPACE/pycdc-build" --config Release --parallel 2

          $candidate = Get-ChildItem "$env:GITHUB_WORKSPACE/pycdc-build" -Recurse -Filter "pycdc.exe" -File |
            Select-Object -First 1

          if (-not $candidate) {
            throw "pycdc.exe was not produced."
          }

          Copy-Item $candidate.FullName "$env:GITHUB_WORKSPACE/pycdc.exe" -Force
          & "$env:GITHUB_WORKSPACE/pycdc.exe" --help

      - name: Recover application source
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "recovery/extracted"
          $src = Join-Path $env:GITHUB_WORKSPACE "src"

          if (Test-Path $src) {
            Remove-Item $src -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $src | Out-Null

          $targets = @(
            @{ pyc = "installer.pyc"; py = "installer.py" },
            @{ pyc = "PYZ-00.pyz_extracted/mods.pyc"; py = "mods.py" },
            @{ pyc = "PYZ-00.pyz_extracted/translations.pyc"; py = "translations.py" }
          )

          foreach ($item in $targets) {
            $input = Join-Path $root $item.pyc
            $output = Join-Path $src $item.py

            if (-not (Test-Path -LiteralPath $input -PathType Leaf)) {
              throw "Missing bytecode: $input"
            }

            & "$env:GITHUB_WORKSPACE/pycdc.exe" $input 1> $output 2> "$output.err"
            $code = $LASTEXITCODE

            if ($code -ne 0) {
              Write-Host "pycdc stderr for $($item.py):"
              Get-Content "$output.err" -ErrorAction SilentlyContinue
              throw "pycdc failed for $($item.py) with exit code $code."
            }

            if (-not (Test-Path $output) -or (Get-Item $output).Length -lt 100) {
              throw "Recovered source is unexpectedly empty: $output"
            }

            Remove-Item "$output.err" -Force -ErrorAction SilentlyContinue
            python -m py_compile $output
          }

          Copy-Item "$root/zh_installer.ico" "$src/zh_installer.ico" -Force

          @'
          # Recovered ZH Installer source

          Recovered from the original Python 3.8 PyInstaller executable.
          The source is reconstructed from bytecode and may differ from the original source formatting/comments.
          '@ | Set-Content "$src/README.md" -Encoding UTF8

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --no-cache-dir "pyinstaller==5.13.2"
          python -m pip install --no-cache-dir requests beautifulsoup4 py7zr pycryptodome psutil texttable

      - name: Build EXE from recovered source
        shell: pwsh
        run: |
          Remove-Item "build","dist" -Recurse -Force -ErrorAction SilentlyContinue

          pyinstaller --clean --noconfirm `
            --onefile `
            --noconsole `
            --name "ZH_Installer-WARU" `
            --icon "src/zh_installer.ico" `
            --paths "src" `
            --collect-all py7zr `
            --collect-all psutil `
            --collect-all bs4 `
            "src/installer.py"

          $out = Join-Path $env:GITHUB_WORKSPACE "dist/ZH_Installer-WARU.exe"
          if (-not (Test-Path -LiteralPath $out -PathType Leaf)) {
            throw "EXE was not produced."
          }

          $bytes = [IO.File]::ReadAllBytes($out)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Output is not a valid PE executable."
          }

          Write-Host ("EXE size: {0:N0} bytes" -f (Get-Item $out).Length)

      - name: Save recovered source to Git
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src
          if (git diff --cached --quiet) {
            Write-Host "Recovered source is already committed."
          } else {
            git commit -m "Add recovered editable Python source"
            git push origin HEAD:${{ github.ref_name }}
          }

      - name: Upload recovered source
        uses: actions/upload-artifact@v4
        with:
          name: zh-installer-recovered-source
          path: src
          if-no-files-found: error
          retention-days: 14

      - name: Upload built EXE
        uses: actions/upload-artifact@v4
        with:
          name: zh-installer-waru-exe
          path: dist/ZH_Installer-WARU.exe
          if-no-files-found: error
          retention-days: 14
