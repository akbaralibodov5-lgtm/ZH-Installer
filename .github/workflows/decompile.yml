name: Analyze and Decompile ZH Installer

on:
  workflow_dispatch:
  push:
    paths:
      - "ZH_Installer V1.9.exe"
      - ".github/workflows/decompile.yml"

permissions:
  contents: read

jobs:
  decompile:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify original EXE
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "ZH_Installer V1.9.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Input EXE was not found: $exe"
          }
          $item = Get-Item -LiteralPath $exe
          Write-Host "Input: $($item.FullName)"
          Write-Host ("Size: {0:N0} bytes" -f $item.Length)

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install recovery tools
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<26"
          python -m pip install --no-cache-dir "pyinstxtractor-ng==2025.1.6" "decompyle3==3.9.3"
          pyinstxtractor-ng --help
          decompyle3 --help

      - name: Extract PyInstaller archive
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "ZH_Installer V1.9.exe"
          $recovery = Join-Path $env:GITHUB_WORKSPACE "recovery"
          $extracted = Join-Path $recovery "extracted"

          New-Item -ItemType Directory -Force -Path $recovery | Out-Null

          Push-Location $env:GITHUB_WORKSPACE
          try {
            & pyinstxtractor-ng $exe
            if ($LASTEXITCODE -ne 0) {
              throw "pyinstxtractor-ng failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

          $source = Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Directory -Force |
            Where-Object { $_.Name -like "*_extracted" } |
            Select-Object -First 1

          if (-not $source) {
            Write-Host "Workspace contents:"
            Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force |
              Select-Object Name,Length,Mode |
              Format-Table -AutoSize
            throw "Could not locate the PyInstaller extraction directory."
          }

          if (Test-Path -LiteralPath $extracted) {
            Remove-Item -LiteralPath $extracted -Recurse -Force
          }

          Move-Item -LiteralPath $source.FullName -Destination $extracted

          $all = @(Get-ChildItem -LiteralPath $extracted -Recurse -File)
          Write-Host "Extraction completed."
          Write-Host "Extracted file count: $($all.Count)"

          if ($all.Count -eq 0) {
            throw "PyInstaller extraction produced an empty directory."
          }

      - name: Decompile recovered Python bytecode
        shell: pwsh
        run: |
          $inputRoot = Join-Path $env:GITHUB_WORKSPACE "recovery/extracted"
          $outputRoot = Join-Path $env:GITHUB_WORKSPACE "recovery/source"
          $report = Join-Path $env:GITHUB_WORKSPACE "recovery/decompile-report.txt"

          New-Item -ItemType Directory -Force -Path $outputRoot | Out-Null

          $pycFiles = @(Get-ChildItem -LiteralPath $inputRoot -Recurse -File -Filter "*.pyc")

          "PyInstaller recovery report" | Set-Content -LiteralPath $report -Encoding UTF8
          "PYC files found: $($pycFiles.Count)" | Add-Content -LiteralPath $report -Encoding UTF8

          if ($pycFiles.Count -eq 0) {
            "No .pyc files were found. Extracted file listing:" |
              Add-Content -LiteralPath $report -Encoding UTF8
            Get-ChildItem -LiteralPath $inputRoot -Recurse -File |
              ForEach-Object {
                $_.FullName.Substring($inputRoot.Length).TrimStart('\','/')
              } |
              Add-Content -LiteralPath $report -Encoding UTF8
            throw "No .pyc files were found after extraction."
          }

          $success = 0
          $failed = 0

          foreach ($file in $pycFiles) {
            $relative = $file.FullName.Substring($inputRoot.Length).TrimStart('\','/')
            $target = Join-Path $outputRoot ([IO.Path]::ChangeExtension($relative, ".py"))
            $targetDir = Split-Path -Parent $target
            New-Item -ItemType Directory -Force -Path $targetDir | Out-Null

            $output = & decompyle3 $file.FullName 2>> $report
            $exitCode = $LASTEXITCODE
            $output | Set-Content -LiteralPath $target -Encoding UTF8

            if ($exitCode -eq 0 -and (Test-Path -LiteralPath $target) -and (Get-Item -LiteralPath $target).Length -gt 0) {
              $success++
            } else {
              $failed++
              "FAILED: $relative (exit code $exitCode)" | Add-Content -LiteralPath $report -Encoding UTF8
            }
          }

          "Succeeded: $success" | Add-Content -LiteralPath $report -Encoding UTF8
          "Failed: $failed" | Add-Content -LiteralPath $report -Encoding UTF8

          Write-Host "Successful decompilations: $success"
          Write-Host "Failed decompilations: $failed"

          if ($success -eq 0) {
            throw "No Python bytecode file could be decompiled."
          }

      - name: Write recovery manifest
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "recovery"
          $manifest = Join-Path $root "manifest.json"

          $items = @(Get-ChildItem -LiteralPath $root -Recurse -File |
            ForEach-Object {
              [PSCustomObject]@{
                path = $_.FullName.Substring($root.Length).TrimStart('\','/')
                bytes = $_.Length
              }
            })

          $items | ConvertTo-Json -Depth 3 |
            Set-Content -LiteralPath $manifest -Encoding UTF8

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: zh-installer-recovery
          path: recovery
          if-no-files-found: error
          retention-days: 14
